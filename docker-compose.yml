# =============================================================================
# File: docker-compose.yml
# Module/Service: Deployment
# Layer: Adapter
# Purpose: Base orchestration for Enterprise NotebookLM (infra + app containers).
# Responsibilities:
#   - Run Postgres, Redis, Qdrant, Elasticsearch, MinIO, Neo4j
#   - Run backend-api, celery-worker, celery-beat (query_cache cleanup), frontend (Next.js)
# Dependencies:
#   - Docker Engine + Compose v2; values from .env / .env.example
# Public Exports:
#   - N/A
# Database/Table: PostgreSQL (schema via Alembic Step 3)
# Related Modules: docker-compose.override.yml, System_Architecture_Enterprise_NotebookLM.md
# Important Notes: Vector DB default = Qdrant (see README for pgvector switch).
#   LLM calls must originate only from backend-api (not celery-worker/frontend).
# =============================================================================

name: enterprise-notebooklm

networks:
  enlm-net:
    name: enlm-net
    driver: bridge

volumes:
  postgres:
    name: enlm-postgres
  redis:
    name: enlm-redis
  qdrant:
    name: enlm-qdrant
  elasticsearch:
    name: enlm-elasticsearch
  minio:
    name: enlm-minio
  neo4j:
    name: enlm-neo4j

services:
  postgres:
    image: postgres:16-alpine
    container_name: enlm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notebooklm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notebooklm}
      POSTGRES_DB: ${POSTGRES_DB:-notebooklm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - enlm-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-notebooklm} -d ${POSTGRES_DB:-notebooklm}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: enlm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis:/data
    networks:
      - enlm-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: enlm-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant:/qdrant/storage
    networks:
      - enlm-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: enlm-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
    networks:
      - enlm-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 40s
    ulimits:
      memlock:
        soft: -1
        hard: -1

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: enlm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio:/data
    networks:
      - enlm-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    container_name: enlm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      out=$$(mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD 2>&1) ||
        { echo \"minio-init: alias set failed: $$out\" >&2; exit 1; };
      out=$$(mc mb --ignore-existing local/$$MINIO_BUCKET 2>&1) ||
        { echo \"minio-init: bucket create failed: $$out\" >&2; exit 1; }
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-notebooklm-documents}
    networks:
      - enlm-net
    restart: "no"

  neo4j:
    image: neo4j:5.26-community
    container_name: enlm-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-notebooklm}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j:/data
    networks:
      - enlm-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 40s

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enlm-backend-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-notebooklm}:${POSTGRES_PASSWORD:-notebooklm}@postgres:5432/${POSTGRES_DB:-notebooklm}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/0
      VECTOR_STORE: ${VECTOR_STORE:-qdrant}
      QDRANT_URL: http://qdrant:6333
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-notebooklm}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-notebooklm-documents}
      MINIO_SECURE: "false"
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-local-hash-embedding-v1}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_API_BASE: ${ANTHROPIC_API_BASE:-https://api.anthropic.com}
      GRAPH_LLM_ENABLED: ${GRAPH_LLM_ENABLED:-false}
      GRAPH_LLM_MODEL: ${GRAPH_LLM_MODEL:-claude-3-5-haiku-latest}
      GRAPH_LLM_MAX_TOKENS: ${GRAPH_LLM_MAX_TOKENS:-4096}
      GRAPH_LLM_MAX_INPUT_CHARS: ${GRAPH_LLM_MAX_INPUT_CHARS:-100000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-enterprise-notebooklm-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_CONSOLE_EXPORTER: ${OTEL_CONSOLE_EXPORTER:-false}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me-enterprise-notebooklm-jwt}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - enlm-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enlm-celery-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-notebooklm}:${POSTGRES_PASSWORD:-notebooklm}@postgres:5432/${POSTGRES_DB:-notebooklm}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/0
      VECTOR_STORE: ${VECTOR_STORE:-qdrant}
      QDRANT_URL: http://qdrant:6333
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-notebooklm}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-notebooklm-documents}
      MINIO_SECURE: "false"
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-local-hash-embedding-v1}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_API_BASE: ${ANTHROPIC_API_BASE:-https://api.anthropic.com}
      GRAPH_LLM_ENABLED: ${GRAPH_LLM_ENABLED:-false}
      GRAPH_LLM_MODEL: ${GRAPH_LLM_MODEL:-claude-3-5-haiku-latest}
      GRAPH_LLM_MAX_TOKENS: ${GRAPH_LLM_MAX_TOKENS:-4096}
      GRAPH_LLM_MAX_INPUT_CHARS: ${GRAPH_LLM_MAX_INPUT_CHARS:-100000}
      DOCUMENT_PARSER: ${DOCUMENT_PARSER:-llamaparse}
      LLAMAPARSE_API_KEY: ${LLAMAPARSE_API_KEY:-}
      LLAMAPARSE_BASE_URL: ${LLAMAPARSE_BASE_URL:-https://api.cloud.llamaindex.ai}
      LLAMAPARSE_TIMEOUT_SECONDS: ${LLAMAPARSE_TIMEOUT_SECONDS:-120}
      LLAMAPARSE_MAX_RETRIES: ${LLAMAPARSE_MAX_RETRIES:-3}
      LLAMAPARSE_TIER: ${LLAMAPARSE_TIER:-cost_effective}
      LLAMAPARSE_POLL_INTERVAL_SECONDS: ${LLAMAPARSE_POLL_INTERVAL_SECONDS:-2.0}
    networks:
      - enlm-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      backend-api:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enlm-celery-beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-notebooklm}:${POSTGRES_PASSWORD:-notebooklm}@postgres:5432/${POSTGRES_DB:-notebooklm}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/0
      QUERY_CACHE_CLEANUP_INTERVAL_MINUTES: ${QUERY_CACHE_CLEANUP_INTERVAL_MINUTES:-15}
      QUERY_CACHE_DEFAULT_TTL_SECONDS: ${QUERY_CACHE_DEFAULT_TTL_SECONDS:-86400}
    networks:
      - enlm-net
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: enlm-frontend
    restart: unless-stopped
    environment:
      # Browser-facing URL (docs / rare client direct calls). Host port mapping.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      # BFF Route Handlers run inside this container — must use Docker DNS name,
      # not localhost (localhost here is the frontend container itself).
      # Do NOT interpolate from host .env (often set to localhost for local Next).
      API_INTERNAL_BASE_URL: http://backend-api:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - enlm-net
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1 || exit 1",
        ]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 60s
