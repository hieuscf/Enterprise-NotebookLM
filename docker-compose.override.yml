# =============================================================================
# File: docker-compose.override.yml
# Module/Service: Deployment
# Layer: Adapter
# Purpose: Local-dev overrides (hot reload, source mounts) — auto-merged by Compose.
# Responsibilities:
#   - Mount backend/frontend source for live reload
#   - Keep container node_modules/.next isolated from host mounts
# Dependencies:
#   - docker-compose.yml
# Public Exports:
#   - N/A
# Database/Table: N/A
# Related Modules: docker-compose.yml
# Important Notes: Used automatically with `docker compose up`. For production-
#   like runs without overrides: `docker compose -f docker-compose.yml up -d`.
# =============================================================================

services:
  backend-api:
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-enterprise-notebooklm-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_CONSOLE_EXPORTER: ${OTEL_CONSOLE_EXPORTER:-false}

  celery-worker:
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: development

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command:
      [
        "sh",
        "-c",
        "if [ ! -d node_modules/next ]; then npm ci; fi && npm run dev -- -H 0.0.0.0 -p 3000",
      ]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"

volumes:
  frontend_node_modules:
    name: enlm-frontend-node-modules
  frontend_next:
    name: enlm-frontend-next
