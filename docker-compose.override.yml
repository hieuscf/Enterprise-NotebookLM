# =============================================================================
# File: docker-compose.override.yml
# Module/Service: Deployment
# Layer: Adapter
# Purpose: Local-dev overrides (hot reload, source mounts) — auto-merged by Compose.
# Responsibilities:
#   - Mount backend/frontend source for live reload
#   - Run uvicorn --reload and Next.js dev server
# Dependencies:
#   - docker-compose.yml
# Public Exports:
#   - N/A
# Database/Table: N/A
# Related Modules: docker-compose.yml
# Important Notes: Used automatically with `docker compose up`. For production-
#   like runs without overrides: `docker compose -f docker-compose.yml up -d`.
# =============================================================================

services:
  backend-api:
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: development

  celery-worker:
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: development

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command:
      [
        "sh",
        "-c",
        "if [ ! -d node_modules/next ]; then npm ci; fi && npm run dev -- -H 0.0.0.0 -p 3000",
      ]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
