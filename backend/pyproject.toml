[project]
name = "enterprise-notebooklm-backend"
version = "0.1.0"
description = "Enterprise NotebookLM Backend API (FastAPI)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI idiomatic Depends(...) in defaults; B008 is a false positive here.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/models/**/*.py" = ["E501"]
"alembic/versions/**/*.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
