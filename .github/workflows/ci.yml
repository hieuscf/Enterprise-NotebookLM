# =============================================================================
# File: ci.yml
# Module/Service: Deployment / CI
# Layer: Adapter
# Purpose: GitHub Actions CI for backend (lint/format/test) and frontend (lint/build).
# Responsibilities:
#   - Run on push and pull_request to main
#   - Backend: Python 3.11, ruff, black --check, pytest (incl. /health smoke)
#   - Frontend: Node LTS, npm ci, lint, build
#   - Cache pip and npm dependencies for faster runs
# Dependencies:
#   - backend/requirements.txt, frontend/package-lock.json
# Public Exports:
#   - N/A
# Database/Table: N/A
# Related Modules: backend/tests/test_health.py, backend/app/main.py (/health)
# Important Notes: No business-logic coverage required in Phase 1.1.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + format + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Test (pytest)
        run: pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
