openapi: 3.0.3
info:
  title: Enterprise NotebookLM API
  version: "1.0.0"
  description: >
    API contract cho hệ thống Enterprise NotebookLM (LLM + RAG).
    Bao gồm Workspace Management, Knowledge Base/Document Versioning (Document Understanding qua LlamaParse
    + Hierarchical Chunking), Intelligent Search, AI Chat với Citation (Confidence Engine + Event-driven
    Micro Agents: Rewrite/Graph/SQL), AI Summary, Information Extraction, Multi-document Comparison,
    Report Generation, và Observability.
    Ánh xạ FR1–FR14 (Business_Context.md) và schema v3 (database-design-enterprise-notebooklm.md).
servers:
  - url: https://api.notebooklm.example.com/v1
    description: Production
  - url: https://staging-api.notebooklm.example.com/v1
    description: Staging

tags:
  - name: Auth
  - name: Workspaces
  - name: Documents
  - name: Search
  - name: Chat
  - name: Summaries
  - name: Extractions
  - name: Comparisons
  - name: Reports
  - name: Admin/Users
  - name: Admin/Documents
  - name: Admin/Observability

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------
  # AUTH (FR12)
  # ---------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập, trả về JWT (OAuth2 password/SSO flow tuỳ IdP)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Làm mới access token bằng refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Token mới
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthToken" }

  /auth/me:
    get:
      tags: [Auth]
      summary: Lấy thông tin user hiện tại (platform_role + workspace memberships)
      description: >
        Returns Platform role (`platform_role`: manage | null) and Workspace-scoped
        memberships (`workspaces[].role`: admin | editor | viewer). These scopes are independent.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  # ---------------------------------------------------------------------
  # WORKSPACES (FR1)
  # ---------------------------------------------------------------------
  /workspaces:
    get:
      tags: [Workspaces]
      summary: Danh sách Workspace mà user hiện tại có quyền truy cập
      parameters:
        - { $ref: "#/components/parameters/PageParam" }
        - { $ref: "#/components/parameters/PageSizeParam" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceListResponse" }
    post:
      tags: [Workspaces]
      summary: Tạo Workspace mới (Manage)
      description: >
        Platform Manage only (`platform_role=manage`). Creator becomes workspace owner
        and is added as Workspace Admin in `workspace_members`. Workspace Admin of an
        existing workspace cannot create a new workspace via this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /workspaces/{workspaceId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
    get:
      tags: [Workspaces]
      summary: Chi tiết Workspace
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
    patch:
      tags: [Workspaces]
      summary: Cập nhật Workspace (Workspace Admin or Manage)
      description: >
        Allowed for Workspace Admin of this workspace, or Platform Manage
        (enterprise override). Manage does not become a workspace membership role.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "200":
          description: Đã cập nhật
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Workspaces]
      summary: Xoá Workspace (Workspace Admin or Manage)
      description: >
        Soft-delete. Allowed for Workspace Admin of this workspace, or Platform Manage.
      responses:
        "204": { description: Đã xoá }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /workspaces/{workspaceId}/members:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
    get:
      tags: [Workspaces]
      summary: Danh sách thành viên + vai trò (RBAC)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceMember" }
    post:
      tags: [Workspaces]
      summary: Thêm thành viên vào Workspace (Workspace Admin)
      description: >
        Workspace Admin of this workspace only. Identify the invitee by
        `user_id` and/or `email` (at least one required). Platform Manage is
        not a workspace role and does not automatically grant member management.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                user_id: { type: string, format: uuid, nullable: true }
                email: { type: string, format: email, nullable: true }
                role: { type: string, enum: [admin, editor, viewer] }
      responses:
        "201":
          description: Đã thêm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceMember" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: User is already an active member

  /workspaces/{workspaceId}/member-candidates:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
    get:
      tags: [Workspaces]
      summary: Tìm user để mời vào Workspace (Workspace Admin)
      description: >
        Search active users by full name or email for the invite UI.
        Excludes users who are already active members of this workspace.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, default: "" }
          description: Substring match on full_name or email (case-insensitive)
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MemberCandidate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspaceId}/members/{userId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Workspaces]
      summary: Đổi vai trò thành viên (Workspace Admin)
      description: Workspace Admin of this workspace only. Role enum is workspace-scoped (admin|editor|viewer).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [admin, editor, viewer] }
      responses:
        "200":
          description: Đã cập nhật
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceMember" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Workspaces]
      summary: Xoá thành viên khỏi Workspace (Workspace Admin)
      responses:
        "204": { description: Đã xoá }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------------
  # DOCUMENTS & VERSIONING (FR2)
  # ---------------------------------------------------------------------
  /workspaces/{workspaceId}/documents:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
    get:
      tags: [Documents]
      summary: Danh sách tài liệu trong Workspace
      parameters:
        - { $ref: "#/components/parameters/PageParam" }
        - { $ref: "#/components/parameters/PageSizeParam" }
        - name: file_type
          in: query
          schema: { type: string, enum: [pdf, docx, xlsx, pptx, txt] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentListResponse" }
    post:
      tags: [Documents]
      summary: Upload tài liệu mới (tạo document + version 1, enqueue pipeline)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title]
              properties:
                file: { type: string, format: binary }
                title: { type: string }
      responses:
        "202":
          description: Đã nhận, pipeline đang xử lý bất đồng bộ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentVersion" }

  /workspaces/{workspaceId}/documents/{documentId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/DocumentId" }
    get:
      tags: [Documents]
      summary: Chi tiết tài liệu (kèm current_version)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
    delete:
      tags: [Documents]
      summary: Xoá tài liệu (mọi version)
      responses:
        "204": { description: Đã xoá }

  /workspaces/{workspaceId}/documents/{documentId}/chunks:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/DocumentId" }
    get:
      tags: [Documents]
      summary: Danh sách chunk bản hiện hành (AI panel / deep-link — không phải body)
      description: >
        Trả chunks đã index của current_version (hoặc versionId) cho AI Context,
        outline metadata và deep-link. Không dùng để render Canonical body.
      parameters:
        - name: versionId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentChunkListResponse" }
        "404":
          description: Document không tồn tại
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /workspaces/{workspaceId}/documents/{documentId}/canonical:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/DocumentId" }
    get:
      tags: [Documents]
      summary: Canonical Knowledge Document (Markdown + blocks)
      description: >
        Trả Canonical Markdown và structured blocks cho Knowledge View.
        Original artifact vẫn lấy qua /content. Không parse lại PDF.
      parameters:
        - name: versionId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalDocument" }
        "409":
          description: Canonical Markdown chưa sẵn sàng
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Document/version không tồn tại
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /workspaces/{workspaceId}/documents/{documentId}/content:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/DocumentId" }
    get:
      tags: [Documents]
      summary: Stream file gốc (hoặc preview PDF) cho Original Document Viewer
      description: >
        Trả bytes Original Representation từ MinIO. Không bao giờ trả markdown.
        PDF gốc (hoặc document.pdf sibling) dùng để render; download=true để tải về.
      parameters:
        - name: versionId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: download
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >
            true = tải Original file (DOCX/PDF gốc). false = Preview Representation
            (chỉ khi preview_status=completed; ngược lại 409).
      responses:
        "200":
          description: Binary content (application/pdf hoặc MIME gốc)
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
        "409":
          description: Preview chưa sẵn sàng (pending/processing/failed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Document/version không tồn tại
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /workspaces/{workspaceId}/documents/{documentId}/versions:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/DocumentId" }
    get:
      tags: [Documents]
      summary: Lịch sử version của tài liệu
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocumentVersion" }
    post:
      tags: [Documents]
      summary: Upload lại (thay thế nội dung) → tạo version mới, enqueue pipeline
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "202":
          description: Version mới đang xử lý
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentVersion" }

  /workspaces/{workspaceId}/documents/{documentId}/versions/{versionId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/DocumentId" }
      - { $ref: "#/components/parameters/VersionId" }
    get:
      tags: [Documents]
      summary: Chi tiết 1 version (status, checksum, page_count...)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentVersion" }

  /workspaces/{workspaceId}/documents/{documentId}/versions/{versionId}/set-current:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/DocumentId" }
      - { $ref: "#/components/parameters/VersionId" }
    post:
      tags: [Documents]
      summary: Đặt version này làm current_version_id (rollback/chuyển version)
      responses:
        "200":
          description: Đã cập nhật current version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }

  /workspaces/{workspaceId}/documents/{documentId}/versions/{versionId}/pipeline-status:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/DocumentId" }
      - { $ref: "#/components/parameters/VersionId" }
    get:
      tags: [Documents]
      summary: Trạng thái pipeline_run + từng pipeline_stage_log (Document Understanding/Cleaning/Hierarchical Chunking/Embedding/Graph/Indexing)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineRun" }

  # ---------------------------------------------------------------------
  # SEARCH (FR3, Module 3)
  # ---------------------------------------------------------------------
  /workspaces/{workspaceId}/search:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
    post:
      tags: [Search]
      summary: Tìm kiếm ngữ nghĩa (Hybrid Retrieval Vector+BM25+KG, ghi search_history)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query_text]
              properties:
                query_text: { type: string }
                filters:
                  type: object
                  description: Lọc theo file_type, khoảng thời gian, tag...
                top_k: { type: integer, default: 10 }
      responses:
        "200":
          description: Kết quả đã rerank
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResultResponse" }

  /workspaces/{workspaceId}/search/history:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
    get:
      tags: [Search]
      summary: Lịch sử tìm kiếm của user hiện tại trong Workspace
      parameters:
        - { $ref: "#/components/parameters/PageParam" }
        - { $ref: "#/components/parameters/PageSizeParam" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SearchHistoryItem" }

  /workspaces/{workspaceId}/search/history/{historyId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - name: historyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Search]
      summary: Ghi nhận tài liệu được click từ một lần tìm kiếm (clicked_document_id)
      description: >
        Idempotent — gọi lại với cùng clicked_document_id không gây tác dụng phụ.
        Chỉ chủ sở hữu history (user hiện tại) mới được cập nhật.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clicked_document_id]
              properties:
                clicked_document_id: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchHistoryItem" }
        "404":
          description: History không tồn tại hoặc không thuộc user hiện tại
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------------
  # CHAT (FR4, FR5, FR10, FR11)
  # ---------------------------------------------------------------------
  /workspaces/{workspaceId}/chat/sessions:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
    get:
      tags: [Chat]
      summary: Danh sách phiên chat của user (Conversation Memory)
      parameters:
        - { $ref: "#/components/parameters/PageParam" }
        - { $ref: "#/components/parameters/PageSizeParam" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatSession" }
    post:
      tags: [Chat]
      summary: Tạo phiên chat mới
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }

  /workspaces/{workspaceId}/chat/sessions/{sessionId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/SessionId" }
    get:
      tags: [Chat]
      summary: Chi tiết phiên chat (để tiếp tục ngữ cảnh cũ)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }
    delete:
      tags: [Chat]
      summary: Xoá phiên chat
      responses:
        "204": { description: Đã xoá }

  /workspaces/{workspaceId}/chat/sessions/{sessionId}/messages:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/SessionId" }
    get:
      tags: [Chat]
      summary: Lịch sử tin nhắn trong phiên
      parameters:
        - { $ref: "#/components/parameters/PageParam" }
        - { $ref: "#/components/parameters/PageSizeParam" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatMessage" }
    post:
      tags: [Chat]
      summary: >
        Gửi câu hỏi. Đi qua Query Router (cache_hit/metadata/factoid/complex).
        Response mặc định là SSE stream (text/event-stream); đặt header
        Accept: application/json để nhận non-streaming.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        "200":
          description: >
            Streaming answer (SSE) hoặc JSON đầy đủ nếu Accept=application/json.
            Kèm route_type, citations, message_generation metrics.
          content:
            text/event-stream:
              schema: { type: string }
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }

  /workspaces/{workspaceId}/chat/messages/{messageId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/MessageId" }
    get:
      tags: [Chat]
      summary: Chi tiết 1 message (kèm message_generation nếu role=assistant)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }

  /workspaces/{workspaceId}/chat/messages/{messageId}/citations:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/MessageId" }
    get:
      tags: [Chat]
      summary: Danh sách citation đã verify cho message (để highlight trên tài liệu gốc)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Citation" }

  /workspaces/{workspaceId}/chat/messages/{messageId}/agent-events:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/MessageId" }
    get:
      tags: [Chat]
      operationId: listMessageAgentEvents
      summary: List Micro Agent events for a chat message (FR14)
      description: >
        (moi v3) Chi tiet Micro Agent da duoc kich hoat cho message nay (neu co).
        Tra ve mang rong neu message thuoc route cache_hit/metadata/factoid, hoac
        route=complex nhung confidence=high (khong can agent). Khong tra
        input_payload/output_payload. Message khong thuoc workspace -> 404.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK — list of AgentEvent (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentEvent" }
              examples:
                withEvents:
                  summary: Message had a Rewrite agent
                  value:
                    - id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      agent_type: rewrite
                      trigger_reason: ambiguous_query
                      confidence_score: 0.42
                      triggered_second_retrieval: true
                      model_used: claude-3-5-haiku-latest
                      cost_usd: 0.00012
                      latency_ms: 180
                      created_at: "2026-08-03T08:00:00Z"
                empty:
                  summary: High confidence / non-complex — no agents
                  value: []
        "403":
          description: Forbidden — not a workspace member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Message not found in workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }


  # ---------------------------------------------------------------------
  # SUMMARIES (FR6)
  # ---------------------------------------------------------------------
  /workspaces/{workspaceId}/documents/{documentId}/summaries:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/DocumentId" }
    get:
      tags: [Summaries]
      summary: Danh sách summary đã sinh cho tài liệu
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Summary" }
    post:
      tags: [Summaries]
      summary: Yêu cầu tóm tắt mới (async — Celery)
      description: >
        Tạo Summary với status=processing, enqueue Celery generation, trả 202 ngay.
        FE poll GET detail/list đến khi status=completed|failed. content=null khi processing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [style]
              properties:
                style: { type: string, enum: [short, detailed, by_topic, bullet_points] }
      responses:
        "202":
          description: Accepted — generation job đang xử lý
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /workspaces/{workspaceId}/summaries/{summaryId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - name: summaryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Summaries]
      summary: Chi tiết summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
    delete:
      tags: [Summaries]
      summary: Xoá summary
      responses:
        "204": { description: Đã xoá }

  # ---------------------------------------------------------------------
  # EXTRACTIONS (FR7)
  # ---------------------------------------------------------------------
  /workspaces/{workspaceId}/documents/{documentId}/extractions:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/DocumentId" }
    get:
      tags: [Extractions]
      summary: Danh sách extraction đã thực hiện
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Extraction" }
    post:
      tags: [Extractions]
      summary: Yêu cầu trích xuất có cấu trúc (async — Celery)
      description: >
        Tạo Extraction với status=processing, enqueue Celery generation, trả 202 ngay.
        FE poll GET detail/list đến khi status=completed|failed. result=null khi processing.
        extraction_type=entities tái sử dụng Graph entities (0 LLM) trong worker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [extraction_type]
              properties:
                extraction_type:
                  type: string
                  enum: [table, figures, entities, timeline]
                output_format:
                  type: string
                  enum: [json, table]
                  default: json
      responses:
        "202":
          description: Accepted — generation job đang xử lý
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extraction" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /workspaces/{workspaceId}/extractions/{extractionId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - name: extractionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Extractions]
      summary: Chi tiết extraction
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extraction" }
    delete:
      tags: [Extractions]
      summary: Xoá extraction
      responses:
        "204": { description: Đã xoá }

  # ---------------------------------------------------------------------
  # COMPARISONS (FR8)
  # ---------------------------------------------------------------------
  /workspaces/{workspaceId}/comparisons:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
    get:
      tags: [Comparisons]
      summary: Danh sách comparison đã thực hiện trong Workspace
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comparison" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Comparisons]
      summary: So sánh ≥2 tài liệu (async — Celery)
      description: >
        Tạo Comparison với status=processing, enqueue Celery generation, trả 202 ngay.
        FE poll GET detail/list đến khi status=completed|failed. result=null khi processing.
        document_ids phải thuộc cùng workspaceId (document ngoài workspace → 404).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_ids]
              properties:
                document_ids:
                  type: array
                  minItems: 2
                  items: { type: string, format: uuid }
                focus: { type: string, description: Chủ đề trọng tâm khi so sánh (tuỳ chọn) }
      responses:
        "202":
          description: Accepted — generation job đang xử lý
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comparison" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /workspaces/{workspaceId}/comparisons/{comparisonId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - name: comparisonId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Comparisons]
      summary: Chi tiết comparison
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comparison" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Comparisons]
      summary: Xoá comparison
      responses:
        "204": { description: Đã xoá }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------
  # REPORTS (FR9)
  # ---------------------------------------------------------------------
  /workspaces/{workspaceId}/reports:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
    get:
      tags: [Reports]
      summary: Danh sách báo cáo trong Workspace
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Report" }
    post:
      tags: [Reports]
      summary: Tạo báo cáo tổng hợp từ summary/extraction/comparison/chat đã có
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, items, export_format]
              properties:
                title: { type: string }
                export_format: { type: string, enum: [pdf, docx, markdown] }
                items:
                  type: array
                  items: { $ref: "#/components/schemas/ReportItemInput" }
      responses:
        "202":
          description: Đang sinh báo cáo (bất đồng bộ)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }

  /workspaces/{workspaceId}/reports/{reportId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - name: reportId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Reports]
      summary: Chi tiết báo cáo + trạng thái sinh file
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
    delete:
      tags: [Reports]
      summary: Xoá báo cáo
      responses:
        "204": { description: Đã xoá }

  /workspaces/{workspaceId}/reports/{reportId}/export:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - name: reportId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Reports]
      summary: Tải file báo cáo (PDF/DOCX/Markdown)
      responses:
        "200":
          description: Binary file
          content:
            application/pdf: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
            text/markdown: { schema: { type: string, format: binary } }

  # ---------------------------------------------------------------------
  # ADMIN / OBSERVABILITY (FR12, FR13)
  # Gate: platform_role == manage only. Workspace Admin cannot access /admin/*.
  # ---------------------------------------------------------------------
  /admin/health:
    get:
      tags: [Admin/Observability]
      summary: System & dependency health (Manage)
      description: >
        Platform Manage only. Lightweight availability checks for core
        infrastructure and AI/retrieval dependencies. Does not run RAG,
        OCR, embeddings batch, or LLM generation. Secrets and connection
        strings are never returned.
      operationId: getAdminSystemHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemHealth" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/workspaces/{workspaceId}/query-logs:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
    get:
      tags: [Admin/Observability]
      summary: Log định tuyến truy vấn (Manage) — audit chi phí
      description: Platform Manage only. Workspace Admin of this workspace cannot call /admin/*.
      parameters:
        - { $ref: "#/components/parameters/PageParam" }
        - { $ref: "#/components/parameters/PageSizeParam" }
        - name: route_type
          in: query
          schema: { type: string, enum: [cache_hit, metadata, factoid, complex] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QueryLog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/workspaces/{workspaceId}/pipeline-runs:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
    get:
      tags: [Admin/Observability]
      summary: Danh sách pipeline_run (Manage)
      description: >
        Platform Manage only. Debug Document Understanding → Cleaning →
        Hierarchical Chunking → Embedding → Graph → Indexing. Each run may
        include optional document context (title, version, file_type) resolved
        via document_versions → documents JOIN.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, running, completed, failed] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PipelineRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/workspaces/{workspaceId}/cost-summary:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
    get:
      tags: [Admin/Observability]
      summary: Tổng hợp chi phí LLM theo model/route_type (Manage)
      description: Platform Manage only.
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------------
  # ADMIN / DOCUMENTS (FR2, FR12 — Platform Manage)
  # Gate: platform_role == manage. Workspace Admin ≠ Manage.
  # Global document operations console — not a substitute for
  # /workspaces/{workspaceId}/documents.
  # ---------------------------------------------------------------------
  /admin/documents:
    get:
      tags: [Admin/Documents]
      summary: Danh sách toàn bộ tài liệu enterprise (Manage)
      description: >
        Platform Manage only. Cross-workspace document list with server-side
        pagination, search, filters, and status summary. Status values are
        DocumentVersion.status (processing|ready|failed). Does not return
        binary content or storage credentials.
      operationId: listAdminDocuments
      parameters:
        - { $ref: "#/components/parameters/PageParam" }
        - { $ref: "#/components/parameters/PageSizeParam" }
        - name: workspace_id
          in: query
          schema: { type: string, format: uuid }
          description: Filter by workspace
        - name: status
          in: query
          schema: { type: string, enum: [processing, ready, failed] }
          description: Filter by current DocumentVersion.status
        - name: file_type
          in: query
          schema: { type: string, enum: [pdf, docx, xlsx, pptx, txt] }
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
          description: Search title, filename basename, or workspace name
        - name: sort
          in: query
          schema:
            type: string
            enum: [updated_at, title, size, status, name]
            default: updated_at
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDocumentListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/documents/{documentId}:
    parameters:
      - { $ref: "#/components/parameters/DocumentId" }
    get:
      tags: [Admin/Documents]
      summary: Chi tiết tài liệu enterprise (Manage)
      description: >
        Platform Manage only. Returns document metadata, workspace context,
        current version, and latest pipeline run (with stages) for diagnosis.
        Does not return document binary content.
      operationId: getAdminDocument
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDocumentDetailResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/documents/{documentId}/versions:
    parameters:
      - { $ref: "#/components/parameters/DocumentId" }
    get:
      tags: [Admin/Documents]
      summary: Lịch sử version tài liệu (Manage)
      description: Platform Manage only. Same DocumentVersion shape as workspace API.
      operationId: listAdminDocumentVersions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocumentVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------
  # ADMIN / USERS (FR12 — Platform Manage)
  # Gate: platform_role == manage. Workspace Admin ≠ Manage.
  # ---------------------------------------------------------------------
  /admin/users:
    get:
      tags: [Admin/Users]
      summary: Danh sách toàn bộ user enterprise (Manage)
      description: >
        Platform Manage only. Returns all active users and their workspace memberships.
        Workspace Admin cannot access this endpoint.
      operationId: listAdminUsers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin/Users]
      summary: Tạo tài khoản user enterprise mới (Manage)
      description: Platform Manage only. Password hashed server-side (never returned).
      operationId: createAdminUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAdminUserRequest" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Email already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Admin/Users]
      summary: Xoá vĩnh viễn tài khoản user (Manage — hard delete)
      description: >
        Platform Manage only. Global user entity — Workspace Admin cannot permanently
        delete accounts. Still blocked when target is last workspace admin, owns a
        workspace, or has RESTRICT FK dependents.
      operationId: deleteAdminUser
      responses:
        "204":
          description: Account permanently deleted
        "400":
          description: Self-delete or other business validation failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Conflict — last workspace admin, owns workspace (owner_id RESTRICT),
            or has dependent content with ON DELETE RESTRICT FKs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 1 }
    PageSizeParam:
      name: page_size
      in: query
      schema: { type: integer, default: 20, maximum: 100 }

  responses:
    Unauthorized:
      description: Không xác thực được (token thiếu/hết hạn)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: >
        Không đủ quyền — Platform Manage (`platform_role=manage`) và/hoặc
        Workspace RBAC (`admin` | `editor` | `viewer`) tùy endpoint.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Không tìm thấy tài nguyên trong Workspace
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Request body / path / query không hợp lệ
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }

    AuthToken:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: bearer }
        expires_in: { type: integer, example: 3600 }

    User:
      type: object
      required: [id, email, full_name, workspaces]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        platform_role:
          type: string
          nullable: true
          enum: [manage]
          description: >
            Platform-level role. `manage` grants access to /admin/*.
            null means ordinary user (no Enterprise Admin Console access).
            Independent of workspaces[].role.
        workspaces:
          type: array
          items:
            type: object
            properties:
              workspace_id: { type: string, format: uuid }
              role:
                type: string
                enum: [admin, editor, viewer]
                description: >
                  Workspace-scoped role for this membership only.
                  admin | editor | viewer — never manage.

    CreateAdminUserRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 1 }
        full_name: { type: string, minLength: 1, maxLength: 255 }

    AdminUserResponse:
      type: object
      required: [id, email, full_name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }

    AdminUserMembership:
      type: object
      required: [workspace_id, workspace_name, role, joined_at]
      properties:
        workspace_id: { type: string, format: uuid }
        workspace_name: { type: string }
        role: { type: string, enum: [admin, editor, viewer] }
        joined_at: { type: string, format: date-time }

    AdminUserListItem:
      type: object
      required: [user_id, email, full_name, memberships]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/AdminUserMembership" }

    AdminUserListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUserListItem" }

    AdminDocumentSummary:
      type: object
