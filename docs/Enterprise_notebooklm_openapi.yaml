        workspace_name: { type: string }
        file_type: { type: string, enum: [pdf, docx, xlsx, pptx, txt] }
        current_version_id: { type: string, format: uuid, nullable: true }
        version_number: { type: integer, nullable: true }
        file_size_bytes: { type: integer, nullable: true }
        page_count: { type: integer, nullable: true }
        status:
          type: string
          nullable: true
