    Workspace:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkspaceListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Workspace" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    WorkspaceMember:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string, enum: [admin, editor, viewer] }
        joined_at: { type: string, format: date-time }

    MemberCandidate:
      type: object
      required: [user_id, email, full_name]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }

    Document:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        title: { type: string }
        file_type: { type: string, enum: [pdf, docx, xlsx, pptx, txt] }
        current_version_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DocumentListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    DocumentVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        uploaded_by: { type: string, format: uuid }
        version_number: { type: integer }
        file_size_bytes: { type: integer }
        checksum_sha256: { type: string }
        page_count: { type: integer }
        status: { type: string, enum: [processing, ready, failed] }
        is_current: { type: boolean }
        parser: { type: string, example: llamaparse, description: "Engine dùng cho Document Understanding" }
        created_at: { type: string, format: date-time }

    PipelineRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        document_version_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, running, completed, failed] }
        retry_count: { type: integer }
        error_message: { type: string, nullable: true }
        stages:
          type: array
          items: { $ref: "#/components/schemas/PipelineStageLog" }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        document_id:
          type: string
          format: uuid
          nullable: true
          description: Present on admin pipeline-runs list (JOIN); may be null elsewhere.
        document_title:
          type: string
          nullable: true
        file_type:
          type: string
          enum: [pdf, docx, xlsx, pptx, txt]
          nullable: true
        version_number:
          type: integer
          nullable: true

    PipelineStageLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        stage:
          type: string
          enum:
            [
              ocr_cleaning,
              chunking,
              preview_generation,
              document_understanding,
              cleaning_normalize,
              hierarchical_chunking,
              embedding,
              graph_extraction,
              indexing,
            ]
        status: { type: string, enum: [pending, running, completed, failed] }
        duration_ms: { type: integer }
        metadata: { type: object }
        error_message: { type: string, nullable: true }

    SearchResultResponse:
      type: object
      properties:
        history_id:
          type: string
          format: uuid
          description: >
            Id bản ghi search_history vừa tạo — dùng cho PATCH
            /search/history/{historyId} khi user click một kết quả.
        results_count: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              chunk_id: { type: string, format: uuid, nullable: true }
              entity_id: { type: string, format: uuid, nullable: true }
              document_id: { type: string, format: uuid }
              document_title: { type: string, nullable: true }
              text_snippet: { type: string }
              retrieval_method:
                type: string
                enum: [vector, bm25, knowledge_graph, rerank]
              score: { type: number, format: float }
              rank: { type: integer }
              page_number: { type: integer, nullable: true }
              location:
                $ref: "#/components/schemas/ContentLocation"
                nullable: true

    SearchHistoryItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        query_text: { type: string }
        filters: { type: object }
        results_count: { type: integer }
        clicked_document_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }

    ChatSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        title: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChatMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        generation:
          $ref: "#/components/schemas/MessageGeneration"
          nullable: true
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        created_at: { type: string, format: date-time }

    MessageGeneration:
      type: object
      properties:
        route_type:
          type: string
          enum: [cache_hit, metadata, factoid, complex]
        confidence_level:
          type: string
          enum: [high, low]
          nullable: true
          description: "Chỉ có giá trị khi route_type=complex; NULL cho 3 route còn lại"
        confidence_score: { type: number, format: float, nullable: true }
        agent_triggered: { type: boolean, default: false }
        model_used: { type: string, nullable: true }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }
        cost_usd: { type: number, format: double }
        latency_ms: { type: integer }
        finish_reason:
          type: string
          enum: [stop, length, content_filter, tool_calls]

    Citation:
      type: object
      properties:
        id: { type: string, format: uuid }
        message_id: { type: string, format: uuid }
        retrieval_id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        chunk_id:
          type: string
          format: uuid
          nullable: true
          description: Source document_chunks.id via retrievals (for Document Viewer deep-link).
        document_version_id:
          type: string
          format: uuid
          nullable: true
          description: Exact document version used when the citation was created.
        text_snippet: { type: string }
        verified: { type: boolean }
        order_index: { type: integer }
        location:
          $ref: "#/components/schemas/ContentLocation"
          nullable: true
          description: Deterministic page/section locator from the source chunk.
        locator:
          $ref: "#/components/schemas/CitationLocator"
          nullable: true
          description: Canonical Knowledge View locator (block/range); not LLM-generated.

    CitationLocator:
      type: object
      description: Deterministic locator for Knowledge View highlight + Original provenance
      properties:
        type: { type: string, enum: [canonical] }
        view: { type: string, enum: [knowledge] }
        confidence: { type: string, enum: [exact, normalized, none] }
        markdown_start: { type: integer, nullable: true }
        markdown_end: { type: integer, nullable: true }
        ranges:
          type: array
          items:
            type: object
            properties:
              block_id: { type: string }
              start: { type: integer }
              end: { type: integer }
        page_number: { type: integer, nullable: true }
        section_index: { type: integer, nullable: true }
        bbox:
          type: array
          items: { type: number }
          nullable: true

    ContentLocation:
      type: object
      description: Vị trí nội dung — page_number XOR section_index theo file_type (FR5)
      properties:
        page_number: { type: integer, nullable: true }
        section_index: { type: integer, nullable: true }
        section_title: { type: string, nullable: true }

    CanonicalDocument:
      type: object
      description: Canonical Knowledge Representation for one document_version
      properties:
        document_id: { type: string, format: uuid }
        document_version_id: { type: string, format: uuid }
        document_title: { type: string }
        file_type: { type: string, enum: [pdf, docx, xlsx, pptx, txt] }
        markdown: { type: string }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/CanonicalBlock" }
        heading_tree:
          type: array
          items: { type: object }
        has_original: { type: boolean }
        preview_status:
          type: string
          enum: [pending, processing, completed, failed]

    CanonicalBlock:
      type: object
      properties:
        id: { type: string }
        order_index: { type: integer }
        block_type: { type: string, enum: [heading, paragraph, table, list, figure] }
        content: { type: string }
        heading_path: { type: string, nullable: true }
        heading_level: { type: integer, nullable: true }
        depth: { type: integer }
        markdown_start: { type: integer, nullable: true }
        markdown_end: { type: integer, nullable: true }
        page_number: { type: integer, nullable: true }
        section_index: { type: integer, nullable: true }
        bbox:
          type: array
          items: { type: number }
          nullable: true

    DocumentChunkListResponse:
      type: object
      properties:
        document_id: { type: string, format: uuid }
        document_version_id: { type: string, format: uuid, nullable: true }
        document_title: { type: string }
        file_type: { type: string, enum: [pdf, docx, xlsx, pptx, txt] }
        viewer_kind: { type: string, enum: [pdf, original_download] }
        preview_status:
          type: string
          enum: [pending, processing, completed, failed]
        preview_type:
          type: string
          enum: [pdf, html, image]
          nullable: true
        preview_generated_at: { type: string, format: date-time, nullable: true }
        heading_tree:
          type: array
          items: { type: object }
        items:
          type: array
          items: { $ref: "#/components/schemas/DocumentChunk" }

    DocumentChunk:
      type: object
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        document_version_id: { type: string, format: uuid }
        chunk_index: { type: integer }
        content: { type: string }
        page_number: { type: integer, nullable: true }
        section_index: { type: integer, nullable: true }
        section: { type: string, nullable: true }
        heading_path: { type: string, nullable: true }
        section_path: { type: string, nullable: true }
        bounding_box:
          type: array
          items: { type: number }
          nullable: true
          description: Optional [x, y, w, h] from layout_metadata
        start_offset: { type: integer, nullable: true }
        end_offset: { type: integer, nullable: true }
        block_ids:
          type: array
          items: { type: string }
          description: Canonical block ids overlapping this chunk

    AgentEvent:
      type: object
      description: "(mới v3) Ghi lại 1 lần Event Policy Engine kích hoạt Micro Agent khi Confidence Engine đánh giá Low Confidence"
      properties:
        id: { type: string, format: uuid }
        message_id: { type: string, format: uuid }
        agent_type: { type: string, enum: [rewrite, graph, sql] }
        trigger_reason:
          type: string
          enum: [ambiguous_query, multi_hop_reasoning, structured_misclassified]
        confidence_score: { type: number, format: float, nullable: true }
        triggered_second_retrieval: { type: boolean }
        model_used: { type: string, nullable: true }
        cost_usd: { type: number, format: double }
        latency_ms: { type: integer }
        created_at: { type: string, format: date-time }

    SummaryTopicSection:
      type: object
      required: [title, content]
      properties:
        topic_id: { type: string, format: uuid, nullable: true }
        title: { type: string }
        content: { type: string }

    Summary:
      type: object
      required: [id, document_id, source_version_id, style, status, created_at]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        source_version_id:
          type: string
          format: uuid
          description: document_versions.id captured at POST (pinned for generation)
        style: { type: string, enum: [short, detailed, by_topic, bullet_points] }
        status: { type: string, enum: [processing, completed, failed] }
        content:
          type: string
          nullable: true
          description: >
            null khi processing/failed; plain/markdown text khi completed.
            bullet_points = markdown list; short/detailed = paragraphs.
        sections:
          type: array
          nullable: true
          description: Structured topic groups for style=by_topic only; null otherwise
          items: { $ref: '#/components/schemas/SummaryTopicSection' }
        created_at: { type: string, format: date-time }

    Extraction:
      type: object
      required:
        - id
        - document_id
        - source_version_id
        - extraction_type
        - output_format
        - status
        - created_at
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        source_version_id:
          type: string
          format: uuid
          description: document_versions.id captured at POST (pinned for generation)
        extraction_type: { type: string, enum: [table, figures, entities, timeline] }
        output_format: { type: string, enum: [json, table] }
        status: { type: string, enum: [processing, completed, failed] }
        result:
          type: object
          nullable: true
          description: >
            null khi processing/failed. Khi completed: structured payload —
            output_format=json → type-specific (table headers+rows; figures[];
            entities[]; timeline events[]). output_format=table → luôn headers+rows.
        created_at: { type: string, format: date-time }

    Comparison:
      type: object
      required: [id, workspace_id, document_ids, status, created_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        document_ids:
          type: array
          items: { type: string, format: uuid }
        status: { type: string, enum: [processing, completed, failed] }
        result:
          type: object
          nullable: true
          description: >
            null khi processing/failed; object khi completed.
          properties:
            similarities: { type: array, items: { type: string } }
            differences: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }

    ReportItemInput:
      type: object
      properties:
        source_type:
          type: string
          enum: [summary, extraction, comparison, chat_session]
        source_id: { type: string, format: uuid }
        order_index: { type: integer }

    Report:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        title: { type: string }
        export_format: { type: string, enum: [pdf, docx, markdown] }
        status: { type: string, enum: [pending, ready, failed] }
        file_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    QueryLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        message_id: { type: string, format: uuid, nullable: true }
        cache_id: { type: string, format: uuid, nullable: true }
        query_text: { type: string }
        route_type: { type: string, enum: [cache_hit, metadata, factoid, complex] }
        llm_calls_count: { type: integer }
        model_used: { type: string, nullable: true }
        latency_ms: { type: integer }
        created_at: { type: string, format: date-time }

    HealthStatus:
      type: string
      enum: [healthy, degraded, unhealthy, unknown]

    HealthServiceCategory:
      type: string
      enum: [core, ai_retrieval]

    HealthService:
      type: object
      required: [id, name, category, status, checked_at, critical]
      properties:
        id:
          type: string
          description: Stable machine id (postgresql, redis, celery_worker, …)
        name:
          type: string
          description: Human-readable service label
        category: { $ref: "#/components/schemas/HealthServiceCategory" }
        status: { $ref: "#/components/schemas/HealthStatus" }
        provider:
          type: string
          nullable: true
          description: Concrete provider when known (e.g. qdrant, minio)
        message:
          type: string
          nullable: true
          description: Sanitized status message (no secrets / URLs with credentials)
        checked_at: { type: string, format: date-time }
        response_time_ms:
          type: integer
          nullable: true
          description: Health-check probe latency only (not a performance SLA)
        critical:
          type: boolean
          description: When true, unhealthy status fails overall system health

    SystemHealth:
      type: object
      required: [status, checked_at, services]
      properties:
        status: { $ref: "#/components/schemas/HealthStatus" }
        checked_at: { type: string, format: date-time }
        message:
          type: string
          nullable: true
          description: Overall human-readable summary
        services:
          type: array
          items: { $ref: "#/components/schemas/HealthService" }

    CostSummary:
      type: object
      properties:
        total_cost_usd: { type: number, format: double }
        total_llm_calls: { type: integer }
        # Additive token aggregates from message_generations (NULL tokens → 0)
        total_prompt_tokens: { type: integer, description: Sum of prompt_tokens }
        total_completion_tokens: { type: integer, description: Sum of completion_tokens }
        total_tokens: { type: integer, description: Sum of total_tokens }
        by_model:
          type: array
          items:
            type: object
            properties:
              model_used: { type: string }
              calls: { type: integer }
              cost_usd: { type: number, format: double }
              prompt_tokens: { type: integer }
              completion_tokens: { type: integer }
              total_tokens: { type: integer }
        by_route_type:
          type: array
          items:
            type: object
            properties:
              route_type: { type: string }
              count: { type: integer }
        # FR14 additive field — Micro Agent rollup from agent_events (backward-compatible)
        by_agent_type:
          type: object
          additionalProperties:
            type: object
            properties:
              total_cost_usd: { type: number, format: double }
              total_latency_ms: { type: integer }
              count: { type: integer }
              average_latency_ms: { type: number, format: double }
          description: >
            Per agent_type aggregates from agent_events (rewrite / graph / sql).
            Optional additive field; clients that ignore unknown keys remain compatible.
          example:
            rewrite:
              total_cost_usd: 0.032
              total_latency_ms: 1543
              count: 52
              average_latency_ms: 29.67
            graph:
              total_cost_usd: 0
              total_latency_ms: 893
              count: 34
              average_latency_ms: 26.26
            sql:
              total_cost_usd: 0
              total_latency_ms: 281
              count: 17
              average_latency_ms: 16.53